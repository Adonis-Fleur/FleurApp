<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeanTube Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('leantube.static', filename='css/style.css') }}">
</head>
<body>
    <nav>
        <a href="{{ url_for('leantube.home') }}" class="logo">LeanTube</a>
        <a href="{{ url_for('leantube.settings') }}" class="nav-link">Settings</a>
    </nav>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-container">
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
