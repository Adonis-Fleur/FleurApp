<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeanAI — New Character</title>
  <link rel="stylesheet" href="/LeanAI/static/leanai.css">
</head>
<body>

  <div class="page-header">
    <a href="/LeanAI">←</a>
    <h1>{% if char %}Edit Character{% else %}New Character{% endif %}</h1>
  </div>

  {% if msg %}
    <div style="margin: 12px 24px 0;">
      <div class="msg">{{ msg }}</div>
    </div>
  {% endif %}

  <form method="POST" action="{% if char %}/LeanAI/characters/{{ char.id }}/edit{% else %}/LeanAI/characters/new{% endif %}" enctype="multipart/form-data">
    <div class="section-card">

      <div class="avatar-wrap">
        <div class="avatar-circle" onclick="document.getElementById('avatar-input').click()" id="avatar-preview">
          {% if char and char.avatar_path %}
            <img src="/LeanAI/static/avatars/{{ char.avatar_path }}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">
          {% elif char %}
            {{ char.name[:1] }}
          {% else %}
            ?
          {% endif %}
        </div>
        <input type="file" id="avatar-input" name="avatar" accept="image/*" onchange="previewAvatar(event)" style="display:none">
        <p style="color:#504060;font-size:12px">Tap avatar to upload</p>
      </div>

      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Character name" required maxlength="60" value="{{ char.name if char else '' }}" oninput="updateAvatarLetter(this.value)">
      </div>

      <div class="field">
        <label for="greeting">Greeting <span style="color:#504060;font-weight:400;text-transform:none">(optional)</span></label>
        <textarea id="greeting" name="greeting" placeholder="What does {{char}} say first?" maxlength="1000" style="min-height:60px">{{ char.greeting if char else '' }}</textarea>
      </div>

      <div class="field">
        <label for="personality">Personality / Description</label>
        <textarea id="personality" name="personality" placeholder="Describe who this character is. This becomes {{char}} in prompts." maxlength="2000" style="min-height:100px">{{ char.personality if char else '' }}</textarea>
      </div>

      <label class="toggle-row" style="margin-top:12px">
        <input type="checkbox" name="ignore_global_prompt" value="1" {{ 'checked' if char and char.ignore_global_prompt else '' }}>
        <span class="toggle-track"><span class="toggle-knob"></span></span>
        <span style="font-size:14px;color:#a090b8">Ignore global prompt</span>
      </label>

      <div class="btn-row">
        <button type="submit" class="btn btn-primary">Save Character</button>
      </div>

    </div>
  </form>

  <script>
    function previewAvatar(event) {
      var file = event.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(e) {
        var preview = document.getElementById('avatar-preview');
        preview.innerHTML = '<img src="' + e.target.result + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%">';
      };
      reader.readAsDataURL(file);
    }

    function updateAvatarLetter(value) {
      var preview = document.getElementById('avatar-preview');
      var img = preview.querySelector('img');
      if (!img && value) {
        preview.textContent = value[0].toUpperCase();
      } else if (!img && !value) {
        preview.textContent = '?';
      }
    }
  </script>

</body>
</html>
